<!DOCTYPE html>
<html>
<head>
    <title>InstaShare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.1/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light min-vh-100 d-flex py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-12">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">InstaShare</h1>
                    <p class="text-muted small mb-4">Online clipboard that runs on all your devices.</p>

                    <form>
                        <label for="inputShareSpaceId" class="form-label fw-semibold">Enter the ShareSpace ID to
                            join</label>
                        <div class="input-group mb-1">
                            <span class="input-group-text">#</span>
                            <input type="text" class="form-control" placeholder="ShareSpace ID" id="inputShareSpaceId">
                            <button type="button" class="btn btn-primary" id="btnEnter" onclick="enterSpace()">Enter
                            </button>
                        </div>
                    </form>

                    <div class="alert alert-secondary mt-3 mb-4 py-2" role="status" id="spaceStatus">You haven't joined
                        any share space yet
                    </div>

                    <div class="border-top pt-4">
                        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
                            <h2 class="h6 mb-0">Space <span class="badge bg-primary" id="labelShareSpaceId">$shareSpaceId</span>
                                <span id="labelSaved">$saved</span>
                            </h2>
                            <small class="text-muted">Last updated on <span id="timeLastUpdate">$dateTime</span></small>
                        </div>

                        <textarea class="form-control mb-3" id="textDisplayEdit" rows="6"
                                  placeholder="Enter the text you wish to share across all devices"
                                  oninput="startEditing()"></textarea>

                        <div class="d-flex gap-2 justify-content-end">
                            <!--                            <button type="button" class="btn btn-outline-primary" id="btnEdit">Edit</button>-->
                            <button type="button" class="btn btn-success" id="btnSubmit" onclick="save()">Submit
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="jumbotron text-center" style="margin-bottom:0">
        <p>Connection Status: <span id="connectionStatus">$status</span></p>
    </div>
</div>
</body>

<script src="/static/clipboardShare.js"></script>
</html>
