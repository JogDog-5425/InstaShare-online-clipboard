<!DOCTYPE html>
<html>
<head>
    <title>InstaShare</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.1.1/js/bootstrap.bundle.min.js"></script>
    <style>
        #imagePreview {
            height: 300px;
            min-height: 0;
            overflow: hidden;
        }

        #imagePreview img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-12">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">InstaShare</h1>
                    <p class="text-muted small mb-4">Online clipboard that runs on all your devices.</p>

                    <!-- Space Id input group -->
                    <form>
                        <label for="inputShareSpaceId" class="form-label fw-semibold">Enter the ShareSpace ID to
                            join</label>
                        <div class="input-group mb-1">
                            <span class="input-group-text">#</span>
                            <input type="text" class="form-control" placeholder="ShareSpace ID" id="inputShareSpaceId">
                            <button type="button" class="btn btn-primary" id="btnEnter" onclick="enterSpace()">Enter
                            </button>
                        </div>
                    </form>

                    <div class="alert alert-secondary mt-3 mb-4 py-2" role="status" id="spaceStatus">You haven't joined
                        any share space yet
                    </div>

                    <!-- Content edit group -->
                    <div class="border-top pt-4">
                        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
                            <h2 class="h6 mb-0">Space <span class="badge bg-primary" id="labelShareSpaceId">$shareSpaceId</span>
                                <span id="labelSaved">$saved</span>
                            </h2>
                            <small class="text-muted">Last updated on <span id="timeLastUpdate">$dateTime</span></small>
                        </div>

                        <!-- Text edit -->
                        <textarea class="form-control mb-3" id="textDisplayEdit" rows="6"
                                  placeholder="Enter the text you wish to share across all devices"
                                  oninput="startEditing()"></textarea>

                        <!-- Image upload -->
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span>Image clipboard</span>
                                <span id="imageStatus" class="badge bg-secondary">No image</span>
                            </div>

                            <div>
                                <div class="row g-4">

                                    <!-- Image preview -->
                                    <div class="col-md-7">
                                        <div id="imagePreview"
                                             class="border rounded d-flex align-items-center justify-content-center bg-light">
                                            <span class="text-muted">Image preview</span>
                                        </div>
                                    </div>

                                    <!-- Operation division -->
                                    <div class="col-md-5 d-flex flex-column">

                                        <!-- Upload division -->
                                        <div id="dropZone"
                                             class="border border-2 rounded p-4 text-center mb-3"
                                             style="cursor: pointer;">
                                            <div class="mb-2">
                                                <i class="bi bi-cloud-arrow-up" style="font-size: 2rem;"></i>
                                            </div>
                                            <div class="fw-semibold">Click to upload image</div>
                                            <div class="text-muted small">Or paste using Ctrl-V / Command-V</div>
                                            <input id="fileInput" type="file" accept="image/*" hidden/>
                                        </div>

                                        <!-- Button groups -->
                                        <div class="d-grid gap-2 mb-3">
                                            <button id="btnCopy" class="btn btn-outline-primary" disabled onclick="addToSystemClipboard()">
                                                <i class="bi bi-clipboard"></i> Copy image
                                            </button>
                                            <button id="btnDownload" class="btn btn-outline-success" disabled onclick="downloadImage()">
                                                <i class="bi bi-download"></i> Download image
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <button type="button" class="btn btn-success" id="btnSubmit" onclick="save()">Submit
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="jumbotron text-center" style="margin-bottom:0">
        <p>Connection Status: <span id="connectionStatus">$status</span></p>
    </div>
</div>
</body>

<script type="module" src="/static/clipboardShare.js"></script>
<script type="module" src="/static/imageUpload.js"></script>
</html>
